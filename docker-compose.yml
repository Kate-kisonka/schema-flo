services:
  backend:
    build: ./backend
    ports:
        "3001:3001"
    env_file:
      - .env

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"    