services:
  postgres:
    image: postgres:16-alpine
    container_name: schema-flo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: schema_flo
      POSTGRES_USER: schema_flo
      POSTGRES_PASSWORD: schema_flo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schema_flo -d schema_flo"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: schema-flo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: schema_flo
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build: ./backend
    container_name: schema-flo-backend
    restart: unless-stopped
    command: sh -c "npm run migrate && npm start"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"


    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://schema_flo:schema_flo@postgres:5432/schema_flo
      JWT_SECRET: local-dev-secret-change-me-min-32-chars
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173


    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: schema-flo-frontend
    working_dir: /app

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"  #Принимать запросы на http://localhost
      - "traefik.http.services.frontend.loadbalancer.server.port=5173" # Пересылать их на порт фронтенда

    environment:
      VITE_API_URL: http://localhost:3001
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  traefik:
     image: traefik:v3.7
     command:
       - "--log.level=DEBUG"
       - "--api.insecure=true"
       - "--providers.docker=true"
       - "--entrypoints.web.address=:80"
     ports:
       - "80:80"
       - "8080:8080"
     volumes:
       - /var/run/docker.sock:/var/run/docker.sock
  caddy:
     image: caddy:latest
     container_name: schema-flo-caddy
     restart: unless-stopped
     ports:
       - "81:81"
       - "443:443"
     volumes:
       - ./Caddyfile:/etc/caddy/Caddyfile
       - ./data:/data
       - ./config:/config
volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:
