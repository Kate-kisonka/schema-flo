name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

env:
  NODE_VERSION: 20.20.2
  REGISTRY: registry.solutions.ooo

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            application/backend/package-lock.json
            application/frontend/package-lock.json

      - name: Install and test backend
        working-directory: application/backend
        run: |
          npm ci
          npm test
          node --check server.js

      - name: Audit backend dependencies
        working-directory: application/backend
        run: npm audit --omit=dev --audit-level=high

      - name: Install, test, lint and build frontend
        working-directory: application/frontend
        run: |
          npm ci
          node --test
          npm run lint
          npm run build

      - name: Audit frontend dependencies
        working-directory: application/frontend
        run: npm audit --audit-level=high

      - name: Validate Caddy source and Swarm Stack
        env:
          DOMAIN: schema-flo.invalid
          TEAM_ID: validation-team
          CERTRESOLVER: validation-resolver
          IMAGE_TAG: validation-sha
          FRONTEND_VOLUME_NODE: validation-node
          OLLAMA_NODE_LABEL: validation-node
          OLLAMA_MODEL: qwen2.5:3b-instruct
          OLLAMA_LIMIT_CPUS: "4.0"
          OLLAMA_LIMIT_MEMORY: 8G
          OLLAMA_RESERVATION_CPUS: "2.0"
          OLLAMA_RESERVATION_MEMORY: 4G
          CADDY_CONFIG_NAME: schema_flo_caddy_config_validation
          DB_HOST_SECRET_NAME: schema_flo_db_host_validation
          DB_PORT_SECRET_NAME: schema_flo_db_port_validation
          DB_USER_SECRET_NAME: schema_flo_db_user_validation
          DB_NAME_SECRET_NAME: schema_flo_db_name_validation
          DB_PASSWORD_SECRET_NAME: schema_flo_db_password_validation
          JWT_SECRET_NAME: schema_flo_jwt_validation
          FRONTEND_IMAGE: registry.solutions.ooo/validation/frontend
          BACKEND_IMAGE: registry.solutions.ooo/validation/backend
          CADDY_IMAGE: caddy:2.11.3-alpine
          OLLAMA_IMAGE: ollama/ollama:0.32.1
        run: |
          docker run --rm \
            -v "$PWD/deploy/stack/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile
          docker stack config -c docker-compose-dev.yml >/dev/null

  images:
    runs-on: ubuntu-latest
    needs: verify
    env:
      FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE }}
      BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE }}
    steps:
      - uses: https://github.com/actions/checkout@v4

      - name: Validate registry configuration
        if: github.event_name == 'push'
        run: |
          : "${FRONTEND_IMAGE:?Set the FRONTEND_IMAGE repository variable}"
          : "${BACKEND_IMAGE:?Set the BACKEND_IMAGE repository variable}"
          case "$FRONTEND_IMAGE" in "$REGISTRY"/*) ;; *) exit 1 ;; esac
          case "$BACKEND_IMAGE" in "$REGISTRY"/*) ;; *) exit 1 ;; esac

      - name: Log in to the corporate registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" \
            --username "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build immutable application images
        run: |
          docker build \
            --file application/frontend/Dockerfile \
            --tag "schema-flo-frontend:$GITHUB_SHA" \
            application/frontend
          docker build \
            --file application/backend/Dockerfile \
            --tag "schema-flo-backend:$GITHUB_SHA" \
            application/backend

      - name: Scan frontend image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.66.0 image --exit-code 1 --severity HIGH,CRITICAL \
            "schema-flo-frontend:$GITHUB_SHA"

      - name: Scan backend image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.66.0 image --exit-code 1 --severity HIGH,CRITICAL \
            "schema-flo-backend:$GITHUB_SHA"

      - name: Publish immutable images
        if: github.event_name == 'push'
        run: |
          docker tag "schema-flo-frontend:$GITHUB_SHA" "$FRONTEND_IMAGE:$GITHUB_SHA"
          docker tag "schema-flo-backend:$GITHUB_SHA" "$BACKEND_IMAGE:$GITHUB_SHA"
          docker push "$FRONTEND_IMAGE:$GITHUB_SHA"
          docker push "$BACKEND_IMAGE:$GITHUB_SHA"

      - name: Publish optional latest aliases from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$FRONTEND_IMAGE:$GITHUB_SHA" "$FRONTEND_IMAGE:latest"
          docker tag "$BACKEND_IMAGE:$GITHUB_SHA" "$BACKEND_IMAGE:latest"
          docker push "$FRONTEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:latest"
